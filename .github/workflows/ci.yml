name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Only used for canonical URLs inside the build; Render's real value is
        # set in the Render dashboard. Override it here if you want CI to check
        # your production domain instead.
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://my-room.onrender.com' }}
        run: npm run build

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger the Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_HOOK:-}" ]; then
            echo "::warning title=Deploy skipped::RENDER_DEPLOY_HOOK_URL is not configured."
            echo "See docs/DEPLOY.md — either add the secret, or let Render auto-deploy on push."
            exit 0
          fi

          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$DEPLOY_HOOK")
          echo "Render responded with HTTP $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error title=Deploy failed::Render rejected the deploy hook (HTTP $status)."
            exit 1
          fi

          echo "### Deploy triggered :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Render accepted the deploy hook (HTTP $status)." >> "$GITHUB_STEP_SUMMARY"
